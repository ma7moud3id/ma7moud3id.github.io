<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud Eid — Digital Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020203; --surface:#07080b; --surface-2:#0c0e13;
    --border:#1b2130; --border-bright:#2a3550;
    --text:#f2f3f5; --muted:#98a2b3; --dim:#4b5567;
    --cyan:#2ee6ff; --magenta:#e838ff;
    --font-display:'Orbitron', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'Space Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:40px 16px; overflow:hidden;
    background-image:
      linear-gradient(rgba(46,230,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,230,255,.05) 1px, transparent 1px);
    background-size:36px 36px;
    position:relative;
  }
  .mono{ font-family:var(--font-mono); }
  a{ color:inherit; text-decoration:none; }

  .glow-orb{ display:none; }

  .circuit-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .circuit-node{
    position:absolute; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px 2px currentColor; opacity:0; animation:nodeRise linear infinite;
  }
  .circuit-node.magenta{ background:var(--magenta); }
  @keyframes nodeRise{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-100vh) scale(1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .circuit-node{ animation:none; display:none; } }

  .card-wrap{ position:relative; width:380px; z-index:1; }
  .trace-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:2; }
  .trace-rect{ fill:none; stroke:var(--cyan); stroke-width:2; filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 2px #fff); }
  @media (prefers-reduced-motion: reduce){ .trace-svg{ display:none; } }

  .card{
    position:relative; z-index:1; background:linear-gradient(180deg, #0a0d13, #050608);
    border-radius:24px; overflow:hidden; padding:34px 28px 26px;
    box-shadow:0 60px 120px -40px rgba(46,230,255,.25), 0 30px 80px -30px rgba(232,56,255,.15);
  }
  .card::after{
    content:""; position:absolute; left:0; right:0; height:70px; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(46,230,255,.10), transparent);
    animation:scanSweep 4s ease-in-out infinite;
  }
  @keyframes scanSweep{ 0%{ top:-80px; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:100%; opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .card::after{ animation:none; display:none; } }

  .status-row{ display:flex; justify-content:center; align-items:center; gap:7px; margin-bottom:22px; opacity:0; animation:riseIn .6s ease forwards; animation-delay:.1s; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:pulseDot 1.8s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(.7); } }
  .status-row span{ font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:var(--cyan); }

  .photo-wrap{ display:flex; justify-content:center; margin-bottom:20px; opacity:0; animation:riseIn .6s ease forwards; animation-delay:.2s; }
  .photo-ring{
    width:120px; height:120px; border-radius:50%; background:#000; position:relative;
    border:2px solid var(--cyan); box-shadow:0 0 0 5px rgba(46,230,255,.08);
  }
  .photo-ring::before{
    content:""; position:absolute; inset:-8px; border-radius:50%; border:1px solid rgba(46,230,255,.35);
    animation:ringPulse 2.4s ease-in-out infinite;
  }
  @keyframes ringPulse{ 0%,100%{ transform:scale(1); opacity:.6; } 50%{ transform:scale(1.08); opacity:0; } }
  .photo-ring img{ width:100%; height:100%; object-fit:cover; object-position:center top; border-radius:50%; background:#000; }
  @media (prefers-reduced-motion: reduce){ .photo-ring::before{ animation:none; display:none; } }

  .name-block{ text-align:center; margin-bottom:26px; opacity:0; animation:riseIn .6s ease forwards; animation-delay:.3s; }
  .name-block h1{
    font-family:var(--font-display); font-weight:800; font-size:23px; letter-spacing:1px;
    background:linear-gradient(90deg, var(--cyan), var(--magenta)); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:gradShift 4s ease infinite;
  }
  @keyframes gradShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .name-block .role{ font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:8px; }

  .info-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .info-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border);
    border-radius:12px; background:rgba(255,255,255,.015); transition:all .25s ease;
    opacity:0; animation:riseIn .5s ease forwards;
  }
  .info-row:nth-child(1){ animation-delay:.4s; }
  .info-row:nth-child(2){ animation-delay:.48s; }
  .info-row:nth-child(3){ animation-delay:.56s; }
  .info-row:hover{ border-color:var(--cyan); background:rgba(46,230,255,.06); transform:translateX(4px); }
  .info-row .ic{
    width:36px; height:36px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    color:var(--cyan); flex-shrink:0;
  }
  .info-row .icon{ width:16px; height:16px; }
  .info-row .meta{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .info-row .meta b{ font-family:var(--font-mono); font-size:9px; letter-spacing:1px; color:var(--magenta); font-weight:400; }
  .info-row .meta span{ font-family:var(--font-mono); font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .social-row{ display:flex; justify-content:center; gap:12px; margin-bottom:22px; opacity:0; animation:riseIn .6s ease forwards; animation-delay:.66s; }
  .social-row a{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:var(--muted); transition:all .2s ease;
  }
  .social-row a:hover{ border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 14px rgba(46,230,255,.3); transform:translateY(-2px); }
  .social-row .icon{ width:16px; height:16px; }

  .portfolio-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;
    padding:16px 20px; font-family:var(--font-mono); font-weight:700; font-size:13px; letter-spacing:1px;
    background:linear-gradient(100deg, var(--cyan), var(--magenta)); background-size:200% auto; color:#050506;
    border-radius:12px; transition:filter .2s ease, transform .2s ease, background-position .4s ease;
    opacity:0; animation:riseIn .6s ease forwards; animation-delay:.74s;
  }
  .portfolio-btn:hover{ filter:brightness(1.1); transform:translateY(-2px); background-position:100% 0; }

  .support-link{
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--muted);
    padding:12px; border:1px solid var(--border); border-radius:10px;
    opacity:0; animation:riseIn .6s ease forwards; animation-delay:.82s; transition:all .2s ease;
  }
  .support-link .pay-icon{ width:15px; height:15px; color:var(--cyan); }
  .support-link b{ color:var(--text); font-weight:600; letter-spacing:.5px; }
  .support-link:hover{ border-color:var(--cyan); background:rgba(46,230,255,.05); color:var(--cyan); }
  .support-link:hover b{ color:var(--cyan); }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .status-row,.photo-wrap,.name-block,.info-row,.social-row,.portfolio-btn,.support-link{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  @media (max-width:420px){ .card-wrap{ width:92vw; } }
</style>
</head>

<script>
  const bg = document.getElementById('circuitBg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(bg && !reduceMotion){
    const count = 26;
    for(let i=0;i<count;i++){
      const n = document.createElement('div');
      n.className = 'circuit-node' + (Math.random() > 0.55 ? ' magenta' : '');
      const size = 2 + Math.random()*3;
      n.style.width = size+'px';
      n.style.height = size+'px';
      n.style.left = (Math.random()*100)+'vw';
      n.style.bottom = '-10px';
      n.style.animationDuration = (7 + Math.random()*9)+'s';
      n.style.animationDelay = (Math.random()*10)+'s';
      bg.appendChild(n);
    }
  }

  function setupTrace(){
    const wrap = document.querySelector('.card-wrap');
    const svg = document.getElementById('traceSvg');
    const rect = document.getElementById('traceRect');
    if(!wrap || !svg || !rect) return;
    const w = wrap.offsetWidth, h = wrap.offsetHeight;
    const sw = 2;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    rect.setAttribute('x', sw/2);
    rect.setAttribute('y', sw/2);
    rect.setAttribute('width', w - sw);
    rect.setAttribute('height', h - sw);
    const perimeter = 2*((w-sw)+(h-sw));
    const dashLen = perimeter * 0.16;
    rect.style.strokeDasharray = `${dashLen} ${perimeter - dashLen}`;
    if(!reduceMotion){
      rect.animate(
        [{ strokeDashoffset: 0 }, { strokeDashoffset: -perimeter }],
        { duration: 4500, iterations: Infinity, easing: 'linear' }
      );
    }
  }
  window.addEventListener('load', setupTrace);
  window.addEventListener('resize', setupTrace);
</script>
